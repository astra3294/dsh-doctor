name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # npm Trusted Publishing (OIDC): the job only needs read access to the
      # checkout plus the id-token used to sign the provenance attestation.
      # No NPM_TOKEN, no .npmrc auth, no 2FA-bypass token involved.
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Publish to npm
        if: ${{ vars.NPM_PUBLISH_ENABLED == 'true' }}
        run: npm publish --provenance --access public

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      # Creating a GitHub release writes repository contents; keep this
      # separate from the publish job so the npm job stays read-only.
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --generate-notes --title "DSH Doctor ${GITHUB_REF_NAME}"
